name: Tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: Python + Node tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: pip install pyarrow   # only for the Overture importer tests (they skip themselves without it)
      - run: npm test        # python3 -m unittest && node --test tests/js (no network, no browser)
      - run: npm run build   # the React UI must keep compiling

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save playwright
      # System packages (mostly fonts) come from Ubuntu's mirrors. When the runner cannot reach them apt retries for ~10 minutes
      # and fails the whole job, before a single test has run. Give it three minutes, carry on with what the image has, and let
      # the browser launch (or the tests) fail loudly if something really is missing.
      - name: System packages for Chromium (best effort)
        run: timeout 180 npx playwright install-deps chromium || echo "::warning::could not install Chromium system packages; continuing with the runner image's"
      - run: npx playwright install chromium
      - run: npm run test:e2e
