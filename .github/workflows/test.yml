name: Tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: Python + Node tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test        # python3 -m unittest && node --test tests/js (no network, no browser)
      - run: npm run build   # the React UI must keep compiling

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
